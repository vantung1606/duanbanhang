services:
  # Backend Service (Spring Boot)
  - type: web
    name: duanbanhang-backend
    env: docker
    dockerfilePath: ./DIY/Dockerfile
    dockerContext: ./DIY
    region: singapore
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: duanbanhang-db
          property: connectionString

  # Frontend Service (Docker)
  - type: web
    name: duanbanhang-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: free
    domains:
      - duongdiyshop.com
      - www.duongdiyshop.com
    envVars:
      - key: VITE_API_URL
        value: https://duanbanhang-backend.onrender.com/api/v1

databases:
  - name: duanbanhang-db
    plan: free
    region: singapore

